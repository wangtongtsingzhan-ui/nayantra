<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/png" sizes="260x260" href="/qingzhan-mark.png?v=20261116" />
    <link rel="shortcut icon" type="image/png" href="/qingzhan-mark.png?v=20261116" />

    <title>清湛灵枢 | 多机器人调度系统</title>
    <script>
      /* Apply the saved theme before first paint so a light-mode reload doesn't flash black. */
      try {
        var t = JSON.parse(localStorage.getItem("nayantra.theme") || '"dark"');
        document.documentElement.dataset.theme = t;
        document.querySelector('meta[name="theme-color"]').setAttribute("content", t === "dark" ? "#000000" : "#ffffff");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
